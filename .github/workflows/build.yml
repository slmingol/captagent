name: Build Packages

on:
  workflow_dispatch:
  push:
    branches: [master, test/combined]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.os_name }} package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: Debian 12
            image: debian:bookworm
            builder: pkg/debian/builder-debian12
            artifact_pattern: "*.deb"
            artifact_name: debian12-package
          - os_name: Debian 13
            image: debian:trixie
            builder: pkg/debian/builder-debian13
            artifact_pattern: "*.deb"
            artifact_name: debian13-package
          - os_name: Rocky Linux 8
            image: rockylinux:8
            builder: pkg/rocky/builder-rocky8
            artifact_pattern: "*.rpm"
            artifact_name: rocky8-package
          - os_name: Rocky Linux 9
            image: rockylinux:9
            builder: pkg/rocky/builder-rocky9
            artifact_pattern: "*.rpm"
            artifact_name: rocky9-package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: captagent_build

      - name: Make builder script executable
        run: chmod +x "${{ github.workspace }}/captagent_build/${{ matrix.builder }}/builder.sh"

      - name: Build package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          docker run --rm \
            -e BUILD_NUMBER \
            -v "${{ github.workspace }}:/tmp/build" \
            -v "${{ github.workspace }}/captagent_build/${{ matrix.builder }}:/scripts" \
            --entrypoint=/scripts/builder.sh \
            ${{ matrix.image }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: "${{ github.workspace }}/${{ matrix.artifact_pattern }}"
          if-no-files-found: error

  build-macos:
    name: Build macOS package
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: captagent_build

      - name: Build package
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          TMP_DIR: ${{ github.workspace }}
        run: |
          chmod +x "${{ github.workspace }}/captagent_build/pkg/macos/builder-macos/builder.sh"
          "${{ github.workspace }}/captagent_build/pkg/macos/builder-macos/builder.sh"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: "${{ github.workspace }}/*.pkg"
          if-no-files-found: error

  publish-release:
    name: Publish prerelease
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-macos
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v7
        with:
          name: macos-package
          path: artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete build-test-combined --yes 2>/dev/null || true
          gh release create build-test-combined \
            --title "Combined build #${{ github.run_number }}" \
            --notes "Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }} | Run: ${{ github.run_number }}" \
            --prerelease \
            artifacts/*.pkg
